[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-music-producer"
version = "0.4.0"
description = "Private local-first AI music producer — Phase 0–4 (refs, conditioned MIDI, critic loop)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — personal use" }
authors = [{ name = "Music AI Project" }]
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "mido>=1.3",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
]
# Optional heavy audio stacks — do NOT install in CI without approval.
# See docs/audio-models.md for enablement steps.
librosa = ["librosa>=0.10"]
demucs = ["demucs>=4.0"]
basic-pitch = ["basic-pitch>=0.3"]
audio-full = ["librosa>=0.10", "demucs>=4.0", "basic-pitch>=0.3"]

[project.scripts]
music-ai = "backend.app.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
